name: Main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    env:
      # Build job does not need Chrome; skip the postinstall download.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-slim
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - run: corepack enable pnpm
        shell: bash
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: matrix.os == 'ubuntu-slim'
        run: pnpm test:coverage
      - if: matrix.os != 'ubuntu-slim'
        run: pnpm test
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-slim'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: false
      - run: pnpm build

  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # Skip the postinstall download; the e2e job uses the runner's
      # preinstalled Chrome instead of a Puppeteer-managed browser.
      PUPPETEER_SKIP_DOWNLOAD: "1"
      AZ2AWS_E2E_AZURE_TENANT_ID: ${{ secrets.AZ2AWS_E2E_AZURE_TENANT_ID }}
      AZ2AWS_E2E_AZURE_APP_ID_URI: ${{ secrets.AZ2AWS_E2E_AZURE_APP_ID_URI }}
      AZ2AWS_E2E_AZURE_DEFAULT_USERNAME: ${{ secrets.AZ2AWS_E2E_AZURE_DEFAULT_USERNAME }}
      AZ2AWS_E2E_AZURE_DEFAULT_PASSWORD: ${{ secrets.AZ2AWS_E2E_AZURE_DEFAULT_PASSWORD }}
      AZ2AWS_E2E_AZURE_DEFAULT_ROLE_ARN: ${{ secrets.AZ2AWS_E2E_AZURE_DEFAULT_ROLE_ARN }}
      AZ2AWS_E2E_AWS_REGION: ${{ vars.AZ2AWS_E2E_AWS_REGION }}
      AZ2AWS_E2E_DURATION_HOURS: ${{ vars.AZ2AWS_E2E_DURATION_HOURS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - run: corepack enable pnpm
        shell: bash
      - run: pnpm install --frozen-lockfile
      - name: Detect system Chrome
        shell: bash
        run: |
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$browser_bin" ]; then
            echo "No Chrome/Chromium executable found on the runner." >&2
            exit 1
          fi
          echo "BROWSER_CHROME_BIN=$browser_bin" >> "$GITHUB_ENV"
          "$browser_bin" --version
      - run: pnpm test:e2e
