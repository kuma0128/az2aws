name: Release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: What to publish
        required: true
        default: docker
        type: choice
        options:
          - all
          - npm
          - docker
          - binaries
      docker_tag:
        description: Git tag to publish, e.g. v1.9.0 (required for Docker publish)
        required: false
        type: string
  release:
    types: [published]

permissions: {}

jobs:
  release-inputs:
    runs-on: ubuntu-slim
    outputs:
      publish_npm: ${{ steps.resolve.outputs.publish_npm }}
      publish_docker: ${{ steps.resolve.outputs.publish_docker }}
      publish_binaries: ${{ steps.resolve.outputs.publish_binaries }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      docker_image_tag: ${{ steps.resolve.outputs.docker_image_tag }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    steps:
      - id: resolve
        shell: bash
        env:
          DISPATCH_DOCKER_TAG: ${{ github.event.inputs.docker_tag }}
          DISPATCH_PUBLISH_TARGET: ${{ github.event.inputs.publish_target }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            publish_target="all"
            docker_tag="$RELEASE_TAG_NAME"
          else
            publish_target="$DISPATCH_PUBLISH_TARGET"
            docker_tag="$DISPATCH_DOCKER_TAG"
          fi

          source_ref="$GITHUB_REF"
          docker_image_tag=""
          publish_npm=false
          publish_docker=false
          publish_binaries=false
          release_tag="$RELEASE_TAG_NAME"

          case "$publish_target" in
            all)
              publish_npm=true
              publish_docker=true
              publish_binaries=true
              ;;
            npm)
              publish_npm=true
              ;;
            docker)
              publish_docker=true
              ;;
            binaries)
              publish_binaries=true
              ;;
            *)
              echo "::error::Unsupported publish_target: $publish_target"
              exit 1
              ;;
          esac

          if [ "$publish_docker" = "true" ]; then
            if [ -z "$docker_tag" ]; then
              echo "::error::docker_tag is required when publishing Docker."
              exit 1
            fi

            if [[ "$docker_tag" =~ [[:space:]] ]] || [[ "$docker_tag" =~ [[:cntrl:]] ]]; then
              echo "::error::docker_tag must not contain whitespace or control characters."
              exit 1
            fi

            if [[ "$docker_tag" == *refs/* ]]; then
              echo "::error::docker_tag must be a plain tag name such as 'v1.2.3', not a full ref."
              exit 1
            fi

            expected_ref="refs/tags/$docker_tag"

            if [ "$GITHUB_REF" != "$expected_ref" ]; then
              echo "::error::Docker publishing must run from '$expected_ref', but this workflow is running from '$GITHUB_REF'."
              exit 1
            fi

            docker_image_tag="${docker_tag#v}"
            docker_image_tag="$(printf '%s' "$docker_image_tag" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"

            if [ -z "$docker_image_tag" ]; then
              echo "::error::docker_tag did not produce a valid Docker image tag."
              exit 1
            fi

            if [ "${#docker_image_tag}" -gt 128 ]; then
              echo "::error::Docker image tag '$docker_image_tag' is ${#docker_image_tag} characters; Docker tags must be 128 characters or fewer."
              exit 1
            fi
          fi

          {
            echo "publish_npm=$publish_npm"
            echo "publish_docker=$publish_docker"
            echo "publish_binaries=$publish_binaries"
            echo "release_tag=$release_tag"
            echo "docker_image_tag=$docker_image_tag"
            echo "source_ref=$source_ref"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: release-inputs
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-inputs.outputs.source_ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - run: corepack enable pnpm
        shell: bash
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lib
          path: lib

  publish-npm:
    needs:
      - release-inputs
      - build
    if: needs.release-inputs.outputs.publish_npm == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-inputs.outputs.source_ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lib
          path: lib

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Publish to npm with provenance (OIDC)
        run: npm publish

  publish-docker:
    needs:
      - release-inputs
      - build
    if: needs.release-inputs.outputs.publish_docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-inputs.outputs.source_ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lib
          path: lib

      - name: Prepare Docker tags
        id: docker-tags
        shell: bash
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/az2aws
          DOCKER_IMAGE_TAG: ${{ needs.release-inputs.outputs.docker_image_tag }}
        run: |
          set -euo pipefail

          docker_tag="$DOCKER_IMAGE_TAG"

          if [ -z "$docker_tag" ]; then
            echo "::error::docker_image_tag is empty."
            exit 1
          fi

          tags=("$IMAGE_NAME:$docker_tag")

          if [[ "$docker_tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags+=("$IMAGE_NAME:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
            tags+=("$IMAGE_NAME:${BASH_REMATCH[1]}")
            tags+=("$IMAGE_NAME:latest")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "version=$docker_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.docker-tags.outputs.version }}

  # Standalone single-executable binaries (Node SEA). Each target is built,
  # signed where applicable, and smoke-tested on its native architecture.
  build-binaries:
    needs:
      - release-inputs
      - build
    if: needs.release-inputs.outputs.publish_binaries == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64
          - os: ubuntu-24.04-arm
            targets: linux-arm64
          - os: macos-latest
            targets: darwin-arm64
          - os: macos-15-intel
            targets: darwin-x64
          - os: windows-latest
            targets: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-inputs.outputs.source_ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - run: corepack enable pnpm
        shell: bash
      - run: pnpm install --frozen-lockfile

      - name: Build binaries
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            node scripts/build-sea.mjs --target "$target" --archive
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.sha256

      - name: Upload binaries to the GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-inputs.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release_tag is empty."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
