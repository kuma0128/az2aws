name: Release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: What to publish
        required: true
        default: docker
        type: choice
        options:
          - all
          - npm
          - docker
          - snap
      docker_tag:
        description: Docker tag source, e.g. v1.9.0 (required for Docker publish)
        required: false
        type: string
  release:
    types: [published]

permissions: {}

jobs:
  release-inputs:
    runs-on: ubuntu-slim
    outputs:
      publish_npm: ${{ steps.resolve.outputs.publish_npm }}
      publish_docker: ${{ steps.resolve.outputs.publish_docker }}
      publish_snap: ${{ steps.resolve.outputs.publish_snap }}
      docker_tag: ${{ steps.resolve.outputs.docker_tag }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            publish_target="all"
            docker_tag="${{ github.event.release.tag_name }}"
          else
            publish_target="${{ inputs.publish_target }}"
            docker_tag="${{ inputs.docker_tag }}"
          fi

          publish_npm=false
          publish_docker=false
          publish_snap=false

          case "$publish_target" in
            all)
              publish_npm=true
              publish_docker=true
              publish_snap=true
              ;;
            npm)
              publish_npm=true
              ;;
            docker)
              publish_docker=true
              ;;
            snap)
              publish_snap=true
              ;;
            *)
              echo "::error::Unsupported publish_target: $publish_target"
              exit 1
              ;;
          esac

          if [ "$publish_docker" = "true" ] && [ -z "$docker_tag" ]; then
            echo "::error::docker_tag is required when publishing Docker."
            exit 1
          fi

          {
            echo "publish_npm=$publish_npm"
            echo "publish_docker=$publish_docker"
            echo "publish_snap=$publish_snap"
            echo "docker_tag=$docker_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: release-inputs
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - run: corepack enable pnpm
        shell: bash
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lib
          path: lib

  publish-npm:
    needs:
      - release-inputs
      - build
    if: needs.release-inputs.outputs.publish_npm == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lib
          path: lib

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Publish to npm with provenance (OIDC)
        run: npm publish

  publish-docker:
    needs:
      - release-inputs
      - build
    if: needs.release-inputs.outputs.publish_docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lib
          path: lib

      - name: Prepare Docker tags
        id: docker-tags
        shell: bash
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/az2aws
          DOCKER_TAG: ${{ needs.release-inputs.outputs.docker_tag }}
        run: |
          set -euo pipefail

          docker_tag="${DOCKER_TAG#v}"
          docker_tag="$(echo "$docker_tag" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"

          if [ -z "$docker_tag" ]; then
            echo "::error::docker_tag did not produce a valid Docker tag."
            exit 1
          fi

          tags=("$IMAGE_NAME:$docker_tag")

          if [[ "$docker_tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags+=("$IMAGE_NAME:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
            tags+=("$IMAGE_NAME:${BASH_REMATCH[1]}")
            tags+=("$IMAGE_NAME:latest")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "version=$docker_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.docker-tags.outputs.version }}

  publish-snap:
    needs:
      - release-inputs
      - build
    if: needs.release-inputs.outputs.publish_snap == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lib
          path: lib

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: build
        with:
          snapcraft-args: --destructive-mode

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
