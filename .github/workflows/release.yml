name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - uses: actions/upload-artifact@v6
        with:
          name: lib
          path: lib

  publish-npm:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: lib
          path: lib
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # OIDC
      - run: npm publish

  publish-docker:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: lib
          path: lib
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/az2aws:latest
          
  create-release:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: lib
          path: lib
          
      - name: Archive artifacts
        run: zip -r az2aws-lib.zip lib package.json
  
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: az2aws-lib.zip
          generate_release_notes: true

  publish-snap:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: lib
          path: lib
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_LOGIN }}
          snap: ${{ steps.build.outputs.snap }}
          release: stable
